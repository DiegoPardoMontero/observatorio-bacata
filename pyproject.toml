[project]
name = "observatorio-bacata"
version = "0.1.0"
description = "Datos abiertos de Bogotá, claros y por localidad"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pandas",
    "duckdb",
    "dbt-duckdb",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not red'"
markers = [
    "red: pruebas que consultan la fuente real por internet (correr con -m red)",
]
