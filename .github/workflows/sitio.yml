# Construye el sitio y lo publica en GitHub Pages en cada push a master.
# Prueba de la Fase 0: la página usa agosto de 2026 de la RMCAB. Como Bronze no
# está en git, el mes se descarga del portal y se guarda en la caché de Actions;
# solo se vuelve a descargar si la caché expira (7 días sin uso).
name: Sitio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar el paquete
        run: pip install -e .

      - name: Recuperar Bronze de la RMCAB (agosto de 2026)
        id: bronze
        uses: actions/cache@v6
        with:
          path: data/bronze/rmcab__horario
          key: rmcab-horario-2026-08

      - name: Extraer agosto de 2026 de la RMCAB
        if: steps.bronze.outputs.cache-hit != 'true'
        run: python -m extract.rmcab --desde 2026-08-01 --hasta 2026-08-31

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Construir el sitio
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
